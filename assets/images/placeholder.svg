<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="parchmentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf7f0"/>
      <stop offset="50%" stop-color="#f4efe4"/>
      <stop offset="100%" stop-color="#ebe3d3"/>
    </linearGradient>
    <pattern id="islamicStarPattern" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M40 0 L50 28 L78 28 L56 46 L64 74 L40 58 L16 74 L24 46 L2 28 L30 28 Z" fill="none" stroke="#d5c8b0" stroke-width="0.75" opacity="0.45"/>
      <circle cx="40" cy="40" r="12" fill="none" stroke="#c59b27" stroke-width="0.5" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#parchmentGrad)"/>
  <rect width="100%" height="100%" fill="url(#islamicStarPattern)"/>

  <!-- Architectural Framing -->
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="#d5c8b0" stroke-width="1.5" rx="6"/>
  <rect x="32" y="32" width="736" height="536" fill="none" stroke="#b8860b" stroke-width="0.75" opacity="0.6" rx="4"/>

  <!-- Center Emblem -->
  <g transform="translate(400, 270)" text-anchor="middle">
    <!-- Eight-Pointed Star (Khatim) -->
    <path d="M0 -42 L13 -29 L31 -31 L29 -13 L42 0 L29 13 L31 31 L13 29 L0 42 L-13 29 L-31 31 L-29 13 L-42 0 L-29 -13 L-31 -31 L-13 -29 Z" fill="#faf7f0" stroke="#b8860b" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#2d5a3e" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="5" fill="#b8860b"/>

    <!-- Brand Typography -->
    <text y="78" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="700" fill="#1c1917" letter-spacing="3">MUGHNI</text>
    <text y="104" font-family="'Amiri', 'Scheherazade New', serif" font-size="22" font-weight="700" fill="#b8860b">مُغْنِي</text>
    <text y="128" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="500" fill="#665e53" letter-spacing="1.5">ISLAMIC VISUAL ARCHIVE</text>
    <text y="148" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" fill="#8c8273">Photograph Visual Placeholder</text>
  </g>
</svg>
